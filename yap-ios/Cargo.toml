[package]
name = "yap-ios-host"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
opfs.workspace = true
yap-frontend-rs = { path = "../yap-frontend-rs", features = ["fixtures"] }
bridgerton.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "net", "fs"] }
yap-i18n = { version = "0.1.0", path = "../libraries/yap-i18n" }

[dev-dependencies]
weapon = { path = "../libraries/weapon" }
chrono.workspace = true
serde_json.workspace = true
