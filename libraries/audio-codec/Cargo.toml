[package]
name = "audio-codec"
version = "0.1.0"
edition = "2024"

[features]
default = ["full"]
full = ["dep:opus", "dep:minimp3", "dep:hound"]
mp3-encode = ["dep:mp3lame-encoder"]

[dependencies]
anyhow = "1"
minimp3 = { version = "0.6", optional = true }
ogg = "0.9"
opus = { version = "0.3", optional = true }
hound = { version = "3.5.1", optional = true }
mp3lame-encoder = { version = "0.2.5", optional = true, features = ["std"] }
