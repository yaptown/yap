[package]
name = "bridgerton-macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/yaptown/yap"
description = "Attribute macro for bridgerton: one Rust impl, wasm-bindgen and Swift bindings"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
serde_derive_internals = "0.29"
