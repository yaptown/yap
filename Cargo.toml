[workspace]
exclude = ["libraries/bridgerton/fuzz"]
members = [
    "yap-ai-backend",
    "generate-data",
    "language-utils",
    "yap-frontend-rs",
    "libraries/autograde-core",
    "libraries/weapon",
    "libraries/imdex_map",
    "libraries/eyedee",
    "libraries/bridgerton",
    "libraries/bridgerton/macros",
    "libraries/bridgerton/fixture",
    "libraries/bridgerton/cli",
    "libraries/course-spot-check",
    "libraries/sentence-sampler",
    "libraries/clean-nlp-data",
    "libraries/token-corrections",
    "libraries/enumap",
    "libraries/opensubtitles-downloader",
    "libraries/movie-subtitles",
    "libraries/subtitle-corpus",
    "libraries/phoneme-verify",
    "libraries/omnigram",
    "libraries/user-metrics",
    "libraries/google-speech",
    "libraries/audio-codec",
    "libraries/whisper",
    "generate-dictionary-data",
    "yap-mcp",
    "prototypes/yap-swift",
]
resolver = "3"

[workspace.dependencies]
bridgerton = { path = "libraries/bridgerton" }
web-time = "1.1.0"
html2text = "0.17"
html-escape = "0.2"
markdown-tables = "0.1.0"
rusqlite = "0.40"
serde_json = "1.0"
tempfile = "3.27.0"
zip = "8"
schemars = "1"
futures = "0.3.32"
env_logger = "0.11.10"
tsify = { version = "0.5.6", features = ["js"], default-features = false }
tysm = { git = "https://github.com/anchpop/tysm.git", rev = "74a425d6076b632564206b2c48fb7737f6dbf8e4", features = [
    "small-batch-optimization",
] }
# Local-first KV cache store synced to R2 (github.com/anchpop/osmo). All of
# generate-data's caches live in one store at .cache. Git dep until published.
osmo = { git = "https://github.com/anchpop/osmo" }
reqwest = { version = "0.13", features = ["json", "query", "multipart"] }
tokio = { version = "1.52.3", features = ["full"] }
opfs = { git = "https://github.com/anchpop/opfs", rev = "c146fa85082b9d58861f6dd460dcdf812e4b3634" }
idb = { version = "0.6.5" }
# Native + wasm fetch wrapper (github.com/anchpop/fetch-happen). Git dep for
# the native reqwest transport until 0.4 is published to crates.io.
fetch-happen = { git = "https://github.com/anchpop/fetch-happen", rev = "65f9906d5d3a7b994c6145ee6db9d12b1dae92ae" }
# The cross-platform abort mechanism, from the same fetch-happen revision.
abort-signal = { git = "https://github.com/anchpop/fetch-happen", rev = "65f9906d5d3a7b994c6145ee6db9d12b1dae92ae" }
# Grapheme-to-phoneme owns the language and variety defaults. This pin describes
# the renderer, not an assertion that a deployed model used identical labels;
# corpus response keys separate actual WAV content and exact target sequences.
# Needs cmake + a C compiler to build the embedded espeak fork.
g2p = { git = "https://github.com/anchpop/g2p", rev = "acaf547a338efee094f85b19c15226a2971f86da" }
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }
indexmap = { version = "2" }
chrono = "0.4.44"
im = { version = "15.1.0", features = ["serde"] }
log = "0.4"
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
thiserror = "2"
slotmap = { version = "1.1", features = ["serde"] }
wasm-logger = "0.2.0"
unicode-normalization = "0.1.25"
# Shared browser/native named locks.
weblocks = { git = "https://github.com/anchpop/weblocks", rev = "b4e7db5af829e357ab67407609e1fb896ee30cde" }
lexide = { git = "https://github.com/anchpop/lexide.git", rev = "d6ddffe5cb42efd3212a432ba8aa94910899bfde", default-features = false }
indicatif = "0.18"

[workspace.dependencies.rkyv]
git = "https://github.com/anchpop/rkyv.git"
rev = "3639e126c26b6071dea12eeab8b6376196eb9f59"

[workspace.dependencies.lasso]
git = "https://github.com/anchpop/lasso.git"
rev = "babd734da2646353c0924f16882bc61888ae3ba1"

[workspace.dependencies.serde]
version = "1.0"
features = ["derive"]

[profile.release]
opt-level = "s"
# Full LTO makes iterative native tools such as generate-data spend several
# minutes in their final rustc invocation. Release WASM builds opt back into
# LTO explicitly at their build entry points.
lto = false

# Native data-pipeline crates with hot numeric loops (embedding mining,
# unigram training, clustering) want speed, not size. None of these are in
# the WASM dependency graph, so the size-focused default above is pure loss
# for them.
[profile.release.package.generate-data]
opt-level = 3
[profile.release.package.omnigram]
opt-level = 3
[profile.release.package.hdbscan]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
